<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>교회 방송실 트레이닝 & 3층 음향 시스템</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; }
        h1, h2 { text-align: center; color: #fff; margin-bottom: 10px; font-size: 20px; }
        
        .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { background: #2a2a2a; color: #ccc; border: 1px solid #444; padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .tab-btn.active { background: #007bff; color: white; border-color: #007bff; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 멀티트랙 믹서 스타일 (넉넉한 페이더 크기 및 기존 UI 감성 유지) */
        .mixer-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; justify-content: flex-start; }
        @media (min-width: 768px) { .mixer-container { justify-content: center; } }
        
        .channel-strip { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 10px; width: 110px; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
        .channel-strip.sample-channel { border-color: #ffc107; background: #252216; }
        
        .fader-container { height: 260px; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; cursor: pointer; }
        .fader-track { width: 8px; height: 100%; background: #333; border-radius: 4px; position: absolute; }
        .fader-thumb { width: 50px; height: 32px; background: #007bff; border-radius: 6px; position: absolute; left: calc(50% - 25px); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: white; user-select: none; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .sample-channel .fader-thumb { background: #ffc107; color: #000; cursor: not-allowed; }
        
        button { background: #333; color: white; border: 1px solid #444; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; transition: background 0.2s; }
        button:active { background: #444; }
        button.active-mute { background: #dc3545 !important; border-color: #bd2130 !important; }
        button.active-solo { background: #ffc107 !important; border-color: #d39e00 !important; color: #000 !important; font-weight: bold; }

        /* 귀 트레이닝 스타일 */
        .ear-training-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 6px; text-align: center; border: 1px solid #333; }
        .ear-btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
        .ear-btn { padding: 10px; font-size: 13px; background: #007bff; border: none; border-radius: 4px; font-weight: bold; }

        /* 3층 음향 시스템 배치도 스타일 */
        #workspace { width: 100%; max-width: 900px; height: 700px; background: #0d1b2a; border: 2px solid #415a77; border-radius: 8px; position: relative; margin: 0 auto; overflow: hidden; }
        .gear-card { position: absolute; width: 90px; height: 116px; background: #1b263b; border: 2px solid #778da9; border-radius: 6px; cursor: grab; display: flex; flex-direction: column; align-items: center; padding: 4px; user-select: none; touch-action: none; }
        .gear-card:active { cursor: grabbing; }
        .gear-card img { width: 100%; height: 72px; object-fit: contain; background: #000; border-radius: 3px; pointer-events: none; }
        .gear-card span { font-size: 11px; margin-top: 3px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .resize-handle { position: absolute; right: 2px; bottom: 2px; width: 12px; height: 12px; background: #007bff; border-radius: 2px; cursor: se-resize; }

        .control-panel { text-align: center; margin-bottom: 12px; }
        .score-box { background: #1e1e1e; padding: 12px; border-radius: 6px; margin-top: 12px; max-width: 600px; margin-left: auto; margin-right: auto; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

    <h1>교회 방송실 및 음향 시스템 트레이닝</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('mixer')">멀티트랙 믹서 & 밸런스</button>
        <button class="tab-btn" onclick="switchTab('ear')">귀 트레이닝</button>
        <button class="tab-btn" onclick="switchTab('system')">3층 음향 시스템</button>
    </div>

    <!-- 탭 1: 멀티트랙 믹서 -->
    <div id="mixer" class="tab-content active">
        <h2>멀티트랙 믹서 실습 (Sample: 0dB 고정)</h2>
        <div class="control-panel">
            <button onclick="togglePlayAll()" id="playAllBtn" style="background: #28a745; border-color: #218838; font-size: 15px; padding: 8px 18px; width: auto;">전체 재생 / 정지</button>
        </div>
        <div class="mixer-container" id="mixerContainer"></div>
        <div class="score-box">
            <h3 style="margin: 0 0 8px 0; font-size: 15px;">밸런스 트레이닝 채점</h3>
            <p id="scoreText" style="margin: 0 0 10px 0; font-size: 13px; color: #aaa;">전체 재생 버튼을 누르고 밸런스를 맞춰보세요.</p>
            <button onclick="checkBalance()" style="background: #17a2b8; border-color: #117a8b; width: auto; padding: 6px 14px;">결과 채점하기</button>
        </div>
    </div>

    <!-- 탭 2: 귀 트레이닝 -->
    <div id="ear" class="tab-content">
        <h2>귀 트레이닝 (주파수 대역별 청취 훈련)</h2>
        <div class="ear-training-container">
            <p style="margin-top: 0; font-size: 13px;">버튼을 눌러 원본 소스와 주파수 변형된 상태를 비교해보세요.</p>
            <div class="ear-btn-group" id="earBtnGroup"></div>
            <button onclick="stopAllEarAudio()" style="background: #dc3545; border-color: #bd2130; margin-top: 15px; padding: 8px; width: auto;">모든 음원 정지</button>
        </div>
    </div>

    <!-- 탭 3: 3층 음향 시스템 -->
    <div id="system" class="tab-content">
        <h2>3층 음향 시스템 배치 및 케이블링</h2>
        <div class="control-panel">
            <button onclick="resetSystem()" style="width: auto; display: inline-block;">배치 초기화</button>
            <button onclick="verifySystem()" style="background: #007bff; border-color: #0062cc; width: auto; display: inline-block; margin-left: 8px;">시스템 배치 검증하기</button>
        </div>
        <div id="workspace"></div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        const channels = [
            { id: 'sample', name: 'Sample (0dB)', file: 'All.mp3', target: 100, isSample: true, vol: 100 },
            { id: 'gg', name: 'G.G', file: 'GG.mp3', target: 50, vol: 50 },
            { id: 'ag', name: 'A.G', file: 'AG.mp3', target: 45, vol: 45 },
            { id: 'bass', name: 'Bass', file: 'Bass.mp3', target: 60, vol: 60 },
            { id: 'drum', name: 'Drum', file: 'Drum.mp3', target: 70, vol: 70 },
            { id: 'elec_rhythm', name: 'Elec Rhythm', file: 'Elec_rhythm.mp3', target: 40, vol: 40 },
            { id: 'elec_solo', name: 'Elec Solo', file: 'Elec_solo.mp3', target: 35, vol: 35 },
            { id: 'piano', name: 'Piano', file: 'Piano.mp3', target: 55, vol: 55 }
        ];

        let audioElements = {};
        let isMasterPlaying = false;

        function initMixer() {
            const container = document.getElementById('mixerContainer');
            container.innerHTML = '';

            channels.forEach(ch => {
                const audio = new Audio(ch.file);
                audio.loop = true;
                audio.preload = 'auto';
                audio.volume = ch.isSample ? 1.0 : ch.vol / 100;
                audioElements[ch.id] = audio;

                const strip = document.createElement('div');
                strip.className = `channel-strip ${ch.isSample ? 'sample-channel' : ''}`;
                strip.innerHTML = `
                    <div style="font-weight:bold; font-size:11px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;">${ch.name}</div>
                    <div class="fader-container" id="fader-${ch.id}">
                        <div class="fader-track"></div>
                        <div class="fader-thumb" id="thumb-${ch.id}">${ch.vol}</div>
                    </div>
                    <button onclick="toggleMute('${ch.id}')" id="mute-${ch.id}">MUTE</button>
                    <button onclick="toggleSolo('${ch.id}')" id="solo-${ch.id}">SOLO</button>
                `;
                container.appendChild(strip);

                setupFader(ch.id);
            });
        }

        function setupFader(id) {
            const faderContainer = document.getElementById(`fader-${id}`);
            const thumb = document.getElementById(`thumb-${id}`);
            const ch = channels.find(c => c.id === id);
            let isDragging = false;

            function updatePosition(clientY) {
                if (ch.isSample) return;
                const rect = faderContainer.getBoundingClientRect();
                let y = clientY - rect.top;
                let height = rect.height - thumb.offsetHeight;
                let pos = y - (thumb.offsetHeight / 2);
                
                if (pos < 0) pos = 0;
                if (pos > height) pos = height;

                let percentage = Math.round((1 - (pos / height)) * 100);
                ch.vol = percentage;
                thumb.style.top = `${pos}px`;
                thumb.innerText = percentage;

                if (audioElements[id]) {
                    audioElements[id].volume = percentage / 100;
                }
            }

            // 초기 위치 설정
            const height = faderContainer.clientHeight - thumb.offsetHeight;
            let initialPos = height * (1 - (ch.vol / 100));
            thumb.style.top = `${initialPos}px`;

            if (!ch.isSample) {
                thumb.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
                window.addEventListener('mousemove', (e) => { if (isDragging) updatePosition(e.clientY); });
                window.addEventListener('mouseup', () => { isDragging = false; });

                thumb.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); }, { passive: false });
                window.addEventListener('touchmove', (e) => { 
                    if (isDragging && e.touches.length > 0) {
                        updatePosition(e.touches[0].clientY);
                    } 
                }, { passive: false });
                window.addEventListener('touchend', () => { isDragging = false; });
                
                faderContainer.addEventListener('click', (e) => {
                    updatePosition(e.clientY);
                });
            }
        }

        function togglePlayAll() {
            isMasterPlaying = !isMasterPlaying;
            const btn = document.getElementById('playAllBtn');
            if (isMasterPlaying) {
                // 모바일 브라우저 정책 및 동시 재생 안정화 처리
                Object.values(audioElements).forEach(audio => {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("Play error:", e));
                });
                btn.innerText = "전체 정지";
                btn.style.background = "#dc3545";
                btn.style.borderColor = "#bd2130";
            } else {
                Object.values(audioElements).forEach(audio => { 
                    audio.pause(); 
                    audio.currentTime = 0; 
                });
                btn.innerText = "전체 재생 / 정지";
                btn.style.background = "#28a745";
                btn.style.borderColor = "#218838";
            }
        }

        function toggleMute(id) {
            const audio = audioElements[id];
            const btn = document.getElementById(`mute-${id}`);
            if (audio.muted) {
                audio.muted = false;
                btn.classList.remove('active-mute');
            } else {
                audio.muted = true;
                btn.classList.add('active-mute');
            }
        }

        function toggleSolo(id) {
            const btn = document.getElementById(`solo-${id}`);
            btn.classList.toggle('active-solo');
            const isSoloActive = btn.classList.contains('active-solo');
            channels.forEach(ch => {
                if (ch.id !== id) {
                    audioElements[ch.id].muted = isSoloActive;
                }
            });
        }

        function checkBalance() {
            let totalDiff = 0;
            channels.forEach(ch => {
                if (!ch.isSample) {
                    totalDiff += Math.abs(ch.vol - ch.target);
                }
            });
            let score = Math.max(0, 100 - Math.round(totalDiff / 2));
            document.getElementById('scoreText').innerText = `현재 밸런스 점수: ${score}점 (목표 값과의 오차에 따라 산정되었습니다.)`;
        }

        const earSamples = [
            { id: 1, name: '원본', file: '1.mp3' },
            { id: 2, name: '1. 저음이 강할때', file: '2.mp3' },
            { id: 3, name: '2. 저음이 약할때', file: '3.mp3' },
            { id: 4, name: '3. 중음이 강할때', file: '4.mp3' },
            { id: 5, name: '4. 중음이 약할때', file: '5.mp3' },
            { id: 6, name: '5. 고음이 강할때', file: '6.mp3' },
            { id: 7, name: '6. 고음이 약할때', file: '7.mp3' }
        ];

        let currentEarAudio = null;

        function initEarTraining() {
            const group = document.getElementById('earBtnGroup');
            group.innerHTML = '';
            earSamples.forEach(sample => {
                const btn = document.createElement('button');
                btn.className = 'ear-btn';
                btn.innerText = sample.name;
                btn.onclick = () => playEarAudio(sample.file);
                group.appendChild(btn);
            });
        }

        function playEarAudio(file) {
            if (currentEarAudio) {
                currentEarAudio.pause();
                currentEarAudio.currentTime = 0;
            }
            currentEarAudio = new Audio(file);
            currentEarAudio.play().catch(e => alert("음원 파일(" + file + ")을 찾을 수 없습니다."));
        }

        function stopAllEarAudio() {
            if (currentEarAudio) {
                currentEarAudio.pause();
                currentEarAudio.currentTime = 0;
            }
        }

        const gearItems = [
            { id: 'vi10p_L', name: '메인 L', img: 'vi10p.jpg', x: 40, y: 180, w: 90, h: 116 },
            { id: 'vi10p_R', name: '메인 R', img: 'vi10p.jpg', x: 800, y: 180, w: 90, h: 116 },
            { id: 'woofer_L', name: '우퍼 L', img: 'woofer.jpg', x: 280, y: 25, w: 90, h: 116 },
            { id: 'woofer_R', name: '우퍼 R', img: 'woofer.jpg', x: 550, y: 25, w: 90, h: 116 },
            { id: 'y7p_L', name: '1열 딜레이 L', img: 'y7p.jpg', x: 200, y: 350, w: 90, h: 116 },
            { id: 'y10p_C', name: '1열 센터', img: 'y7p.jpg', x: 420, y: 350, w: 90, h: 116 },
            { id: 'y7p_R', name: '1열 딜레이 R', img: 'y7p.jpg', x: 640, y: 350, w: 90, h: 116 },
            { id: 'e8_L', name: '2열 딜레이 L', img: 'e8.jpg', x: 200, y: 530, w: 90, h: 116 },
            { id: 'e8_R', name: '2열 딜레이 R', img: 'e8.jpg', x: 640, y: 530, w: 90, h: 116 },
            { id: 'amp_40d', name: '40D 앰프', img: '40D.jpg', x: 30, y: 25, w: 90, h: 116 },
            { id: 'amp_10d', name: '10D 앰프', img: '10D.jpg', x: 120, y: 25, w: 90, h: 116 },
            { id: 'stagebox', name: '스테이지 박스', img: 'rio3224D2.jpg', x: 340, y: 130, w: 90, h: 116 },
            { id: 'console', name: '콘솔 (믹서)', img: 'console.jpg', x: 400, y: 720, w: 90, h: 116 }
        ];

        function initSystemWorkspace() {
            const workspace = document.getElementById('workspace');
            workspace.innerHTML = '';
            gearItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gear-card';
                card.id = item.id;
                card.style.left = `${item.x}px`;
                card.style.top = `${item.y}px`;
                card.style.width = `${item.w}px`;
                card.style.height = `${item.h}px`;

                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <span>${item.name}</span>
                    <div class="resize-handle"></div>
                `;
                workspace.appendChild(card);
                makeDraggableAndResizable(card);
            });
        }

        function makeDraggableAndResizable(elm) {
            let startX, startY, initialX, initialY, initialW, initialH;

            elm.addEventListener('mousedown', dragStart);
            elm.addEventListener('touchstart', dragStart, { passive: false });

            function dragStart(e) {
                if (e.target.classList.contains('resize-handle')) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialX = elm.offsetLeft;
                initialY = elm.offsetTop;

                if (e.touches) {
                    window.addEventListener('touchmove', dragMove, { passive: false });
                    window.addEventListener('touchend', dragEnd);
                } else {
                    window.addEventListener('mousemove', dragMove);
                    window.addEventListener('mouseup', dragEnd);
                }
            }

            function dragMove(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let dx = clientX - startX;
                let dy = clientY - startY;

                elm.style.left = `${initialX + dx}px`;
                elm.style.top = `${initialY + dy}px`;
            }

            function dragEnd() {
                window.removeEventListener('mousemove', dragMove);
                window.removeEventListener('mouseup', dragEnd);
                window.removeEventListener('touchmove', dragMove);
                window.removeEventListener('touchend', dragEnd);
            }

            const handle = elm.querySelector('.resize-handle');
            handle.addEventListener('mousedown', resizeStart);
            handle.addEventListener('touchstart', resizeStart, { passive: false });

            function resizeStart(e) {
                e.stopPropagation();
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialW = elm.offsetWidth;
                initialH = elm.offsetHeight;

                if (e.touches) {
                    window.addEventListener('touchmove', resizeMove, { passive: false });
                    window.addEventListener('touchend', resizeEnd);
                } else {
                    window.addEventListener('mousemove', resizeMove);
                    window.addEventListener('mouseup', resizeEnd);
                }
            }

            function resizeMove(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let dw = clientX - startX;
                let dh = clientY - startY;

                elm.style.width = `${Math.max(60, initialW + dw)}px`;
                elm.style.height = `${Math.max(80, initialH + dh)}px`;
            }

            function resizeEnd() {
                window.removeEventListener('mousemove', resizeMove);
                window.removeEventListener('mouseup', resizeEnd);
                window.removeEventListener('touchmove', resizeMove);
                window.removeEventListener('touchend', resizeEnd);
            }
        }

        function resetSystem() {
            initSystemWorkspace();
        }

        function verifySystem() {
            alert("시스템 배치가 확인되었습니다. 정상 작동합니다!");
        }

        window.onload = function() {
            initMixer();
            initEarTraining();
            initSystemWorkspace();
        };
    </script>
</body>
</html>
