<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Pretendard, system-ui, sans-serif">
  <!-- 02-2 디지털 케이블 과정 카드 그림 (2026-11-08: 3층 장비 사진 대신). 디지털 커넥터 네 가지 + 숫자(0·1)가 흐르는 케이블 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2340"/><stop offset="1" stop-color="#15406b"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- 가운데를 지나는 케이블과 숫자 -->
  <path d="M-10 300 C180 250 300 350 400 300 S620 250 810 300" stroke="#22d3ee" stroke-width="16" fill="none" stroke-opacity=".28"/>
  <path d="M-10 300 C180 250 300 350 400 300 S620 250 810 300" stroke="#67e8f9" stroke-width="4" fill="none" stroke-dasharray="3 16" stroke-linecap="round"/>
  <g font-size="34" font-weight="800" fill="#a5f3fc" text-anchor="middle">
    <text x="60" y="270">1</text><text x="130" y="262">0</text><text x="335" y="338">1</text><text x="465" y="276">0</text><text x="680" y="270">1</text><text x="750" y="284">0</text>
  </g>
  <!-- ① XLR (AES/EBU) -->
  <g transform="translate(220 170) scale(.85)">
    <circle r="96" fill="url(#metal)" stroke="#475569" stroke-width="5"/>
    <circle r="76" fill="#1e293b"/>
    <circle cx="-30" cy="-16" r="13" fill="#fbbf24"/><circle cx="30" cy="-16" r="13" fill="#fbbf24"/><circle cx="0" cy="34" r="13" fill="#fbbf24"/>
    <rect x="-11" y="-99" width="22" height="20" rx="3" fill="#475569"/>
  </g>
  <!-- ② etherCON (랜선) -->
  <g transform="translate(580 170) scale(.85)">
    <circle r="96" fill="url(#metal)" stroke="#475569" stroke-width="5"/>
    <rect x="-58" y="-42" width="116" height="76" rx="10" fill="#1e3a8a"/>
    <g fill="#fbbf24"><rect x="-47" y="-32" width="6" height="26"/><rect x="-35" y="-32" width="6" height="26"/><rect x="-23" y="-32" width="6" height="26"/><rect x="-11" y="-32" width="6" height="26"/><rect x="1" y="-32" width="6" height="26"/><rect x="13" y="-32" width="6" height="26"/><rect x="25" y="-32" width="6" height="26"/><rect x="37" y="-32" width="6" height="26"/></g>
    <rect x="-18" y="34" width="36" height="16" fill="#1e3a8a"/>
  </g>
  <!-- ③ TOSLINK (광) -->
  <g transform="translate(220 430) scale(.85)">
    <path d="M-82 -66H82V28L46 66H-46L-82 28Z" fill="#111827" stroke="#64748b" stroke-width="5"/>
    <circle r="44" fill="#ef4444" fill-opacity=".28"/><circle r="20" fill="#ef4444"/>
  </g>
  <!-- ④ BNC (MADI · 워드클럭) -->
  <g transform="translate(580 430) scale(.85)">
    <circle r="84" fill="url(#metal)" stroke="#475569" stroke-width="5"/>
    <circle r="54" fill="#f8fafc" stroke="#64748b" stroke-width="4"/>
    <circle r="13" fill="#b45309"/>
    <rect x="-104" y="-12" width="22" height="24" rx="3" fill="#475569"/><rect x="82" y="-12" width="22" height="24" rx="3" fill="#475569"/>
  </g>
</svg>
